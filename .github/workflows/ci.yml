name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.4'
          - '8.5'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Set Composer cache directory
        run: echo "COMPOSER_CACHE_DIR=$GITHUB_WORKSPACE/.composer-cache" >> "$GITHUB_ENV"

      - name: Restore Composer cache
        uses: actions/cache@v6
        with:
          path: .composer-cache
          key: php-${{ matrix.php }}-${{ runner.os }}-${{ hashFiles('composer.lock', 'composer.json') }}

      - name: Install dependencies
        run: composer install --prefer-dist --no-ansi --no-interaction --no-progress

      - name: Check code style
        run: composer format -- --test

      - name: Run tests
        run: composer test